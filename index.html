<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reloj Digital Neón</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        <div class="clock-circle" id="clockWrapper">
            
            <div id="muteBtn" class="mute-icon" onclick="toggleMute()">
                <i id="speakerIcon" class="fas fa-volume-up"></i>
            </div>

            <div class="time-display">
                <div id="time">00:00:00</div>
                <div id="ampm">AM</div>
            </div>

            <h1 class="titulo-reloj">Reloj Digital</h1>
            
            <div class="controls">
                <input type="time" id="alarmTime">
                
                <div class="button-group">
                    <button onclick="setAlarm()" class="btn-neon">Poner Alarma</button>
                    <button onclick="setClockTime()" class="btn-neon">Ajustar Hora</button>
                </div>

                <button id="stopBtn" onclick="stopAlarm()" class="btn-stop" style="display:none;">
                    DETENER ALARMA
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
